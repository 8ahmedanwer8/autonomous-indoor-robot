frequency: 30
sensor_timeout: 0.2
two_d_mode: true

transform_time_offset: 0.0
transform_timeout: 0.0

print_diagnostics: true
debug: false

publish_tf: true
publish_acceleration: false

map_frame: map
odom_frame: odom
base_link_frame: base_link
world_frame: odom

# State order for each *_config array:
# x, y, z,
# roll, pitch, yaw,
# vx, vy, vz,
# vroll, vpitch, vyaw,
# ax, ay, az

# Wheel odometry from the Arduino bridge. For the cleaner sensor-fusion path,
# use the encoder-derived forward velocity and let the EKF integrate position
# using IMU orientation. Ignore /wheel_odom pose because the bridge currently
# computes that pose using its own gyro-integrated heading.
odom0: /wheel_odom
odom0_config: [false, false, false,
               false, false, false,
               true,  false, false,
               false, false, false,
               false, false, false]
odom0_queue_size: 10
odom0_nodelay: false
odom0_differential: false
odom0_relative: false

# Filtered IMU orientation from imu_filter_madgwick. The filter consumes the
# bridge's raw gyro/accel topic plus /imu/mag and publishes an orientation
# quaternion here.
imu0: /imu/data_filtered
imu0_config: [false, false, false,
              false, false, true,
              false, false, false,
              false, false, true,
              false, false, false]
imu0_queue_size: 20
imu0_nodelay: false
imu0_differential: false
imu0_relative: true
imu0_remove_gravitational_acceleration: true

# New IMU1 – absolute yaw from Madgwick filter, driff-corrected
imu1: /imu/data_filtered
imu1_config: [false, false, false,
              false, false, true,   # yaw orientation
              false, false, false,
              false, false, false,
              false, false, false]
imu1_queue_size: 20
imu1_nodelay: false
imu1_differential: false
imu1_relative: false




