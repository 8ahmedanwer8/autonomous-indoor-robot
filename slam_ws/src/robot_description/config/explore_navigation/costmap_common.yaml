footprint: [[0.12, 0.07], [0.12, -0.07], [-0.12, -0.07], [-0.12, 0.07]]
footprint_padding: 0.01

transform_tolerance: 0.5

obstacle_layer:
  enabled: true
  obstacle_range: 2.5
  raytrace_range: 3.0
  observation_sources: laser_scan
  laser_scan:
    sensor_frame: laser
    data_type: LaserScan
    topic: /scan
    marking: true
    clearing: true
    inf_is_valid: true

  rtabmap_obstacles:
    data_type: PointCloud2
    topic: /rtabmap/cloud_obstacles
    marking: true
    clearing: true
    min_obstacle_height: 0.02
    max_obstacle_height: 0.50
    obstacle_range: 1.5



inflation_layer:
  enabled: true
  inflation_radius: 0.10
  cost_scaling_factor: 4.0

static_layer:
  enabled: true
  map_topic: /rtabmap/grid_map
  subscribe_to_updates: true

