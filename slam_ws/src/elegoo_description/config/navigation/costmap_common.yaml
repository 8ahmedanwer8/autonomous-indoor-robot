footprint: [[0.14, 0.09], [0.14, -0.09], [-0.14, -0.09], [-0.14, 0.09]]
footprint_padding: 0.01

transform_tolerance: 0.5

obstacle_layer:
  enabled: true
  obstacle_range: 2.5
  raytrace_range: 3.0
  observation_sources: laser_scan
  laser_scan:
    sensor_frame: laser
    data_type: LaserScan
    topic: /scan
    marking: true
    clearing: true
    inf_is_valid: true

inflation_layer:
  enabled: true
  inflation_radius: 0.18
  cost_scaling_factor: 5.0

static_layer:
  enabled: true
  map_topic: /rtabmap/grid_map
  subscribe_to_updates: true

