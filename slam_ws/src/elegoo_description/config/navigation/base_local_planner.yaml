TrajectoryPlannerROS:
  holonomic_robot: false

  max_vel_x: 0.15
  min_vel_x: 0.10

  max_vel_theta: 3.5
  min_vel_theta: 3.0
  min_in_place_vel_theta: 3.0
  escape_vel: -0.04

  acc_lim_x: 0.40
  acc_lim_y: 0.0
  acc_lim_theta: 4.0

  yaw_goal_tolerance: 0.25
  xy_goal_tolerance: 0.12
  latch_xy_goal_tolerance: true

  sim_time: 1.2
  sim_granularity: 0.025
  angular_sim_granularity: 0.025
  vx_samples: 16
  vtheta_samples: 20

  meter_scoring: true
  pdist_scale: 0.9
  gdist_scale: 0.6
  occdist_scale: 0.02

