TrajectoryPlannerROS:
  holonomic_robot: false
  max_vel_x: 0.15
  min_vel_x: 0.04

  max_vel_theta: 0.90
  min_vel_theta: -0.90
  min_in_place_vel_theta: 0.35

  escape_vel: -0.04

  acc_lim_x: 0.20
  acc_lim_y: 0.0
  acc_lim_theta: 1.0

  yaw_goal_tolerance: 0.10
  xy_goal_tolerance: 0.20
  latch_xy_goal_tolerance: true

  sim_time: 2.5
  sim_granularity: 0.025
  angular_sim_granularity: 0.025
  vx_samples: 10
  vtheta_samples: 21

  meter_scoring: true
  pdist_scale: 0.9
  gdist_scale: 0.6
  occdist_scale: 0.02
